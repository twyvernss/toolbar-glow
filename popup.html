<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 240px; font: 13px system-ui, sans-serif; background: #17151f; color: #eee; }
  header { padding: 12px 14px; font-weight: 600; background: linear-gradient(90deg, #7b3fe4, #e040a0, #3fa9e4); }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #2a2735; }
  .row.col { flex-direction: column; align-items: stretch; gap: 6px; }
  .row.col span { display: flex; justify-content: space-between; }
  input[type=range] { width: 100%; accent-color: #b26cff; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: #b26cff; }
  small { color: #999; }
</style>
</head>
<body>
  <header>Toolbar Glow</header>
  <label class="row">Enabled <input type="checkbox" id="enabled"></label>
  <label class="row">Colour tabs + address bar <input type="checkbox" id="toolbar"></label>
  <label class="row"><span>YouTube &amp; videos<br><small>follow the video's colours</small></span> <input type="checkbox" id="video"></label>
  <label class="row"><span>Other websites<br><small>match the site's colour</small></span> <input type="checkbox" id="sites"></label>
  <div class="row col">
    <span>Intensity <small id="intensityV"></small></span>
    <input type="range" id="intensity" min="0.1" max="1" step="0.05">
  </div>
  <div class="row col">
    <span>Glow height <small id="heightV"></small></span>
    <input type="range" id="height" min="30" max="320" step="10">
  </div>
  <div class="row"><small id="status">Checking helper…</small></div>
  <script src="popup.js"></script>
</body>
</html>
